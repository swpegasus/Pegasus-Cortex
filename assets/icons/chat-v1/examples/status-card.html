<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portable icon example</title>
<style>
body{font:16px system-ui,sans-serif;background:#eef1f4;color:#17212b;margin:32px}
article{background:white;border:1px solid #bac4ce;border-radius:12px;padding:24px;max-width:420px;box-shadow:0 3px 12px #0001}
.status{display:flex;align-items:center;gap:10px}
img{width:24px;height:24px}
code{font-size:13px;overflow-wrap:anywhere}
</style>
<article>
<div class="status"><img src="../svg/ic_fluent_checkmark_circle_20_regular.svg" alt="Success icon"><strong>Export completed</strong></div>
<p>An icon supplements the actual result text. A check mark alone cannot verify that work succeeded.</p>
<p><code>pegasus.chat-icons.status.success</code></p>

</article>
</html>
